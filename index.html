<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Media Tracker</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <nav class="navbar">
      <div class="nav-logo">
        <h2>MediaVault</h2>
      </div>

      <ul class="nav-links">
        <li><a href="#" class="active">All</a></li>
        <li><a href="#">Watching</a></li>
        <li><a href="#">Completed</a></li>
        <li><a href="#" id="nav-dashboard">Stats</a></li>

        <li>
          <div class="search-wrapper" id="search-wrapper">
            <input
              type="text"
              id="search-input"
              placeholder="Search titles, types, dates..."
              autocomplete="off"
            />
            <button class="search-icon-btn" id="search-icon-btn">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
            </button>
          </div>
        </li>
      </ul>
    </nav>

    <main class="container">
      <section class="form-section">
        <form class="input-group" id="media-form">
          <div class="autocomplete-wrapper">
            <input
              type="text"
              id="title-input"
              placeholder="e.g., Berserk, Bleach: TYBW..."
              autocomplete="off"
            />
            <ul id="suggestions-list" class="suggestions-list"></ul>
          </div>

          <select id="type-input">
            <option value="Anime">Anime</option>
            <option value="Movie">Movie</option>
            <option value="TV-Show">TV Show</option>
            <option value="Game">Game</option>
          </select>

          <select id="status-input">
            <option value="Watching">Currently Watching</option>
            <option value="Completed">Completed</option>
            <option value="Plan to Watch">Plan to Watch</option>
          </select>

          <input
            type="date"
            id="date-input"
            title="Optional: Set a custom start/completion date"
          />
          <button id="submit-btn" class="add-btn">Add to vault</button>
        </form>
      </section>

      <section class="gallery" id="media-gallery">
      </section>
    </main>

    <div class="modal-overlay" id="delete-modal">
      <div class="modal-content">
        <h3>Delete Media?</h3>
        <p>
          Are you sure you want to remove this from your vault? This action
          cannot be undone.
        </p>
        <div class="modal-actions">
          <button class="cancel-btn" onclick="closeDeleteModal()">
            Cancel
          </button>
          <button class="confirm-delete-btn" onclick="confirmDelete()">
            Yes, Delete
          </button>
        </div>
      </div>
    </div>

    <div class="modal-overlay" id="dashboard-modal">
      <div class="modal-content dashboard-content">
        <div class="dashboard-header">
          <h2>Vault Statistics</h2>
          <button class="close-btn" onclick="closeDashboard()">✖</button>
        </div>
        <div class="stats-grid" id="stats-container"></div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
