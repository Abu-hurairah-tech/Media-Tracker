<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Media Tracker</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <nav class="navbar">
      <div class="nav-logo">
        <h2>MediaVault</h2>
      </div>

      <ul class="nav-links">
        <li><a href="#" class="active">All</a></li>
        <li><a href="#">Watching</a></li>
        <li><a href="#">Completed</a></li>

        <li>
          <div class="search-wrapper" id="search-wrapper">
            <input
              type="text"
              id="search-input"
              placeholder="Search titles, types, dates..."
              autocomplete="off"
            />
            <button class="search-icon-btn" id="search-icon-btn">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
            </button>
          </div>
        </li>
      </ul>
    </nav>

    <main class="container">
      <section class="form-section">
        <form class="input-group" id="media-form">
          <input
            type="text"
            placeholder="Berserk, Bleach: TYBW,..."
            autocomplete="off"
            id="title-input"
          />

          <select id="type-input">
            <option value="Anime">Anime</option>
            <option value="Movie">Movie</option>
            <option value="TV-Show">TV Show</option>
            <option value="Game">Game</option>
          </select>

          <select id="status-input">
            <option value="Watching">Currently Watching</option>
            <option value="Completed">Completed</option>
            <option value="Plan to Watch">Plan to Watch</option>
          </select>

          <button id="submit-btn" class="add-btn">Add to vault</button>
        </form>
      </section>

      <section class="gallery" id="media-gallery">
        <div class="media-card dummy-card">
          <button class="edit-btn"><i class="fa-solid fa-pen"></i></button>
          <button class="delete-btn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
              <!--!Font Awesome Free 7.2.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.-->
              <path
                d="M262.2 48C248.9 48 236.9 56.3 232.2 68.8L216 112L120 112C106.7 112 96 122.7 96 136C96 149.3 106.7 160 120 160L520 160C533.3 160 544 149.3 544 136C544 122.7 533.3 112 520 112L424 112L407.8 68.8C403.1 56.3 391.2 48 377.8 48L262.2 48zM128 208L128 512C128 547.3 156.7 576 192 576L448 576C483.3 576 512 547.3 512 512L512 208L464 208L464 512C464 520.8 456.8 528 448 528L192 528C183.2 528 176 520.8 176 512L176 208L128 208zM288 280C288 266.7 277.3 256 264 256C250.7 256 240 266.7 240 280L240 456C240 469.3 250.7 480 264 480C277.3 480 288 469.3 288 456L288 280zM400 280C400 266.7 389.3 256 376 256C362.7 256 352 266.7 352 280L352 456C352 469.3 362.7 480 376 480C389.3 480 400 469.3 400 456L400 280z"
              />
            </svg>
          </button>
          <h3>Jujutsu Kaisen</h3>
          <span class="badge type-anime">Anime</span>
          <span class="badge status-watching">Watching</span>
          <span class="date-Added">Added on: 31/05/2026</span>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
